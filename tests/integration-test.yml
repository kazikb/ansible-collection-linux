---
# Applies the base role composition to disposable supported Linux hosts for
# integration testing. Connection settings and role variables must come from
# an external inventory.
#
# This playbook changes system configuration and may restart services or hosts.
#
# Preview one host:
# ansible-playbook tests/integration-test.yml -i <inventory> --check --diff --limit <host>
#
# Apply the base role composition:
# ansible-playbook tests/integration-test.yml -i <inventory> --limit <host>
#
- name: Apply base roles for integration testing
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: system_baseline
    - role: access_management
    - role: host_hardening
