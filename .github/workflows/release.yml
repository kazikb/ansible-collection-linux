---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release collection
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.18.12

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"

          galaxy_version="$(yq -r '.version' galaxy.yml)"

          if [[ "${tag_version}" != "${galaxy_version}" ]]; then
            echo "Release version mismatch:"
            echo "  Git tag:    ${tag_version}"
            echo "  galaxy.yml: ${galaxy_version}"
            exit 1
          fi

          echo "VERSION=${tag_version}" >> "${GITHUB_ENV}"

      - name: Extract release notes from changelog
        shell: bash
        run: |
          awk -v version="${VERSION}" '
            $0 ~ "^## " version {
                found = 1
                next
            }

            found && /^\s*$/ {
                next
            }

            found && /^## / {
                exit
            }

            found {
                print
            }

            END {
                if (!found) {
                    exit 2
                }
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for version ${VERSION}"
            exit 1
          fi

      - name: Build collection
        shell: bash
        run: |
          mkdir -p dist

          ansible-galaxy collection build --output-path dist

          artifact="dist/kazikb-linux-${VERSION}.tar.gz"

          if [[ ! -f "${artifact}" ]]; then
            echo "Expected collection artifact not found: ${artifact}"
            exit 1
          fi

          echo "ARTIFACT=${artifact}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ARTIFACT}" \
            --verify-tag \
            --title "kazikb.linux ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
