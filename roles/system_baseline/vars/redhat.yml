---
# vars file for system_baseline RedHat OS

system_baseline_locale_config_file: /etc/locale.conf

system_baseline_vimrc_global_config_file: /etc/vimrc.local
system_baseline_editor_path: /usr/bin/vim

system_baseline_cron_service_name: crond.service
system_baseline_chrony_config_file: /etc/chrony.conf

# Distribution specific packages to install
system_baseline_distribution_package_list:
  - bind-utils
  - alternatives
  - vim-enhanced
  - iproute
  - netcat
  - policycoreutils-python-utils

# Root CA
system_baseline_ca_certificates_path: /etc/pki/ca-trust/source/anchors
system_baseline_ca_update_command: update-ca-trust extract
