---
# handlers file for host_hardening

# Keep these handler names and their order aligned with other roles
# that manage SSH daemon configuration. Identical names ensure that
# SSH validation and reload run only once per handler flush.
# Roles using this handlers:
# - access_management
# - host_hardening
- name: Validate SSH daemon configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Reload SSH service
  ansible.builtin.systemd_service:
    name: "{{ host_hardening_sshd_service_name }}"
    state: reloaded

# Ubuntu socket-activated SSH:
# regenerate socket configuration and restart the listener.
- name: Restart SSH socket after SSH configuration changes
  ansible.builtin.systemd_service:
    name: ssh.socket
    daemon_reload: true
    state: restarted
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - host_hardening_sshd_socket_active | default(false) | bool
  listen: Reload SSH service

- name: Withdraw previous role-owned SSH SELinux port
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - host_hardening_sshd_previous_port | length > 0
    - host_hardening_sshd_previous_port != (host_hardening_sshd_port | default('', true) | string)
  community.general.seport:
    ports: "{{ host_hardening_sshd_previous_port }}"
    proto: tcp
    setype: ssh_port_t
    state: absent
    local: true
    ignore_selinux_state: true

- name: Reload ufw service
  when: host_hardening_firewall_enabled | bool
  community.general.ufw:
    state: reloaded

- name: Reload firewalld service
  when: host_hardening_firewall_enabled | bool
  ansible.builtin.systemd_service:
    name: firewalld.service
    state: reloaded

- name: Reboot after kernel module changes
  ansible.builtin.reboot:
  when: host_hardening_kernel_modules_reboot_on_change | bool
